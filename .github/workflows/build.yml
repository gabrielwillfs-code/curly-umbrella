name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar componentes do Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair o projeto (se estiver em .zip)
        run: |
          if ls *.zip >/dev/null 2>&1; then unzip -q -o *.zip; fi

      - name: Compilar
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          cd "$(dirname "$SETTINGS")"
          gradle :app:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/saida/ControleSamsungWiFi.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ControleSamsungWiFi-apk
          path: saida/ControleSamsungWiFi.apk

      - name: Publicar APK em Releases (download direto no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" saida/ControleSamsungWiFi.apk \
            --title "APK #${{ github.run_number }}" \
            --notes "APK de depuração do Controle Samsung Wi-Fi."
